# WebSSH 配置
# ============================================================================
# 文件上传/下载大小限制说明
# ----------------------------------------------------------------------------
# 1. 上传（POST /webssh/api/upload）
#    - 受 Spring Boot 全局 multipart 配置约束，配置项位于 application.yml：
#        spring.servlet.multipart.max-file-size        单文件最大大小（默认 1MB）
#        spring.servlet.multipart.max-request-size     整个请求最大大小（默认 10MB）
#    - 超过限制会抛 MaxUploadSizeExceededException，前端收到 500 错误
#    - 若使用反向代理（如 Nginx），还需同步调整 client_max_body_size
#      以及 Tomcat 的 server.tomcat.max-swallow-size / max-http-form-post-size
#
# 2. 下载（GET /webssh/api/download）
#    - 代码层面无大小限制，采用 SFTP/tar 流式传输（4KB 缓冲区）
#    - 实际上限受 HTTP 超时、代理超时（proxy_read_timeout）等网络层约束
#
# 3. 文件预览（GET /webssh/api/preview）
#    - 硬编码 2MB 限制（WebSshFileController 中 maxSize = 2 * 1024 * 1024）
#    - 超过会提示“文件过大，不支持预览，请直接下载”，如需调整需改源码
# ============================================================================
webssh:
  # ----------------------------------------------------------------------------
  # 基础配置
  # ----------------------------------------------------------------------------
  # 是否启用（设为 false 则完全关闭 WebSSH）
  enabled: true
  # WebSSH 界面访问路径前缀
  context-path: /webssh

  # ----------------------------------------------------------------------------
  # SSH 连接配置
  # ----------------------------------------------------------------------------
  # SSH 连接超时（毫秒）
  timeout: 10000
  # 终端类型
  terminal-type: xterm-256color
  # 字符编码
  charset: UTF-8

  # ----------------------------------------------------------------------------
  # SSH 安全配置（主机密钥校验）
  # ----------------------------------------------------------------------------
  # SSH 主机密钥严格校验。true 时 known_hosts 不存在或不可读会导致连接被拒绝；
  # false 时不校验主机密钥，存在中间人攻击风险，仅建议内网/测试环境使用
  strict-host-key-checking: true
  # 可信主机指纹文件，例如 WEBSSH_KNOWN_HOSTS=/etc/webssh/known_hosts（仅 strict-host-key-checking=true 时生效）
  known-hosts: ${WEBSSH_KNOWN_HOSTS:}

  # ----------------------------------------------------------------------------
  # WebSocket 安全配置
  # ----------------------------------------------------------------------------
  # 空闲 WebSocket 自动断开，避免会话过期后终端仍长期可用。
  websocket-idle-timeout-millis: 1800000
  # WebSocket 仅接受此白名单内的 Origin；生产环境必须覆盖为实际 HTTPS 域名。
  # 多个 Origin 用英文逗号分隔（Origin = 协议+域名+端口，必须完全匹配）；
  # 不能设为 * 或留空，否则 WebSocket 通道会被禁用。环境变量示例：
  #   WEBSSH_ALLOWED_ORIGINS=https://a.example.com,https://b.example.com:8080
  allowed-origins: ${WEBSSH_ALLOWED_ORIGINS:http://127.0.0.1:8080}


  # ============================================================================
  # WebSSH 管理界面登录账号配置（单账号与多账号可共存，用户名冲突时以多账号为准）
  # ----------------------------------------------------------------------------
  # 【密码强度规则】长度 8~19 位（>=8 且 <20），必须同时包含：
  #   - 大写字母 A-Z
  #   - 小写字母 a-z
  #   - 数字 0-9
  # 不符合规则的账号视为无效，启动时仅告警并跳过（不影响启动），但无法用于登录。
  # 例如 "Abc12345" 合规；"webssh"（无大写无数字、长度不足）不合规，会被跳过。
  #
  # 方式一：单账号模式（向后兼容）
  #
  # 方式二：多账号模式（推荐）
  #   accounts:
  #     - username: admin
  #       password: Admin@2024
  #     - username: ops
  #       password: Ops#2024abc
  #
  # 共存规则：
  #   - 两者同时配置时，会合并为最终账号列表共同生效
  #   - 若单账号的 username 与 accounts 中某账号同名，则忽略单账号（以多账号为准）
  #   - 两者均未配置时不阻止启动，仅告警（登录将全部失败）
  # ============================================================================

  # 不要在版本库中提交管理口令。部署时使用环境变量、密钥管理服务或受权限保护的外部配置：
  # 注意：此处不设任何默认口令。未通过 WEBSSH_USERNAME / WEBSSH_PASSWORD 注入凭据时，
  # 启动仅告警且所有登录失败，请勿在此填写回退值。
  username: ${WEBSSH_USERNAME:}
  password: ${WEBSSH_PASSWORD:}

  # 多账号列表（与 username/password 共存；用户名冲突时以多账号为准）
  accounts: [
#    {username: test, password: 123456},
#    {username: root, password: 123456}
  ]

  # SSH 主机列表
  hosts:
    # username&password 模式
    - name: 【192.168.1.166】
      host: 192.168.1.166
      port: 22
      # 可以不配置username&password，登录后在界面手动输入
      username:
      password:

    # privateKey&passphrase 模式
#    - name: 【xxx】
#      host: xxx.xxx.xxx.xxx
#      port: 22
#      privateKey: /path/to/id_rsa
#      passphrase: private-key-password

    # 本地PTY模式示例：webssh与目标机同机部署时，直接启动本地 shell，无需SSH凭据
    # 仅支持 Linux/Mac等类Unix系统（Windows 暂不支持，将报错）
#    - name: 【本机-PTY直连】
#      host: localhost
#      type: local

  # 高风险命令正则列表（命中任意一条则拒绝通过终端执行）
  high-risk-commands:
    # === 文件系统破坏 ===
    - '^rm\s+-rf\s+/'                                   # rm -rf /  (删除根目录)
    - '^rm\s+-rf\s+/\*'                                 # rm -rf /* (删除根目录下所有文件)
    - '^rm\s+-rf\s+~'                                   # rm -rf ~  (删除家目录)
    - '>\s*/dev/sd[a-z]'                                # > /dev/sda (覆盖磁盘)
    - 'dd\s+if=.*of=/dev/'                              # dd 直接写磁盘
    - 'mkfs\.'                                          # mkfs.*    (格式化文件系统)


    # === 权限失控 ===
#    - '^chmod\s+-R\s+777\s+/'                           # chmod -R 777 / (开放所有权限)
#    - '^chown\s+-R\s+\w+:\w+\s+/'                       # chown -R 递归改所有者

    # === 系统关机/重启 ===
    - '^shutdown'                                       # shutdown
#    - '^reboot'                                         # reboot
#    - '^halt'                                           # halt
#    - '^poweroff'                                       # poweroff
#    - '^init\s+[06]'                                    # init 0 / init 6

    # === 进程与磁盘 ===
    - 'fdisk\s+/dev/'                                   # fdisk 磁盘分区
    - 'parted\s+/dev/'                                  # parted 磁盘分区

  # 登录安全策略（防暴力破解）
  login-security:
    max-fail-attempts: 5      							# 最大失败次数（0 或负数=关闭限制）
    lock-minutes: 5           							# 锁定时长（分钟）
    trust-forwarded-for: false 							# 是否信任 X-Forwarded-For（反代场景设为 true）

  # 滑块验证码配置（tianai-captcha，不依赖 redis，使用本地内存缓存）
  captcha:
    # 是否启用滑块验证码（设为 false 则登录时不校验验证码，前端也不弹出滑块）
    enabled: true

# ============================================================================
# tianai-captcha 行为验证码配置（滑块验证码），不依赖 redis，使用本地内存缓存
# ----------------------------------------------------------------------------
# 二次验证开启后，前端滑块校验成功返回 token，登录时携带该 token 进行二次校验
# ============================================================================
captcha:
  # 验证码缓存 key 前缀
  prefix: captcha
  # 验证码过期时间（毫秒），默认 2 分钟
  expire:
    default: 120000
  # 加载系统自带的模板资源（滑块模板）
  init-default-resource: true
  # 本地缓存控制，提前缓存生成好的验证数据以增加并发性
  local-cache-enabled: true
  # 缓存大小
  local-cache-size: 20
  # 缓存拉取失败后等待时间（毫秒）
  local-cache-wait-time: 5000
  # 缓存检查间隔（毫秒）
  local-cache-period: 2000
  # 缓存忽略字段
  local-cache-ignored-cache-fields: ""
  # 二次验证配置（登录时携带验证成功返回的 token 进行二次校验）
  secondary:
    # 开启二次验证
    enabled: true
    # 二次验证 token 过期时间 2 分钟
    expire: 120000
    # 二次验证缓存 key 前缀
    keyPrefix: "captcha:secondary"

# ============================================================================
# 日志配置（logback-spring.xml 已内置，此处可覆盖默认值）
# ----------------------------------------------------------------------------
# 项目通过 logback-spring.xml 集成日志功能，支持：
#   - 控制台输出
#   - 文件输出（按天滚动归档 + 自动清理）
# 默认日志目录结构（位于程序运行目录/jar 包所在目录下）：
#   logs/webssh.log        主日志文件（INFO 及以上）
#   logs/webssh-error.log  错误日志文件（仅 ERROR）
#   logs/history/          历史归档日志（按天压缩 .gz，保留 30 天）
#
# 以下配置项可覆盖 logback-spring.xml 中的默认值，按需调整：
# ============================================================================
logging:
  # 日志级别（root 全局级别，可单独指定包级别）
  level:
    root: INFO
    # 项目自身代码日志级别（调试时可改为 DEBUG）
    com.yyj: INFO
    # WebSSH 框架日志级别
    io.github.youngyajun: INFO
  # 日志文件配置
  file:
    # 日志文件完整路径（优先级高于 path）
    # 默认输出到程序运行目录下 logs/webssh.log
    # 如需固定目录，可改为绝对路径，例如：/var/log/webssh/webssh.log
    name: ./logs/webssh.log
    # 历史归档日志目录（默认 logs/history）
    history-path: ./logs/history
    # 单个日志文件最大大小（超过自动切分）
    max-size: 100MB
    # 日志文件保留天数（超过自动清理）
    max-history: 30
    # 日志总大小上限（超过自动清理最老日志）
    total-size-cap: 3GB
